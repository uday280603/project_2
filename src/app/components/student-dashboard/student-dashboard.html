      <app-student-form

       (emitUpdatedObj)="getUpdatedObj($event)"
       [getEditObj]="editedObj"
      
      ></app-student-form>

    <div class="col-md-8">
      <app-student

      ></app-student>
    </div>
  </div>
</div>
